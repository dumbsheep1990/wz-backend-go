<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>万知相同 - 社区平台</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <header class="wz-header">
        <div class="container">
            <div class="row py-2">
                <div class="col-md-3">
                    <a href="/" class="logo">
                        <img src="/static/images/logo.png" alt="万知" class="logo-image" onerror="this.src='/static/images/logo-placeholder.png'">
                        <span class="logo-text">万知相同</span>
                    </a>
                </div>
                <div class="col-md-6">
                    <form class="search-form">
                        <input type="text" class="form-control search-input" placeholder="请输入搜索内容">
                        <button type="submit" class="btn btn-primary search-btn">搜索</button>
                    </form>
                </div>
                <div class="col-md-3 text-end">
                    <div id="user-info" class="d-none">
                        <span id="user-name"></span>
                        <button id="logout-btn" class="btn btn-outline-secondary btn-sm ms-2">退出</button>
                    </div>
                    <div id="login-btns">
                        <button id="login-btn" class="btn btn-primary">登录</button>
                        <button id="register-btn" class="btn btn-outline-primary ms-2">注册</button>
                    </div>
                </div>
            </div>
        </div>
    </header>
    
    <nav class="wz-nav">
        <div class="container">
            <ul class="nav">
                <li class="nav-item"><a href="/" class="nav-link active">首页</a></li>
                <li class="nav-item"><a href="/communities" class="nav-link">社区列表</a></li>
                <li class="nav-item"><a href="/groups" class="nav-link">群组</a></li>
                <li class="nav-item"><a href="/posts/hot" class="nav-link">热门帖子</a></li>
                <li class="nav-item"><a href="/posts/new" class="nav-link">最新帖子</a></li>
                <li class="nav-item"><a href="/user/posts" class="nav-link">我的帖子</a></li>
            </ul>
        </div>
    </nav>
    
    <main class="container mt-4">
        <div id="app">
            <!-- 内容将通过JavaScript动态加载 -->
            <div class="text-center py-5">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">加载中...</span>
                </div>
                <p class="mt-2">页面加载中，请稍候...</p>
            </div>
        </div>
    </main>
    
    <!-- 登录模态框 -->
    <div class="modal fade" id="login-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">用户登录</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="login-form">
                        <div class="mb-3">
                            <label for="login-username" class="form-label">用户名</label>
                            <input type="text" class="form-control" id="login-username" required>
                        </div>
                        <div class="mb-3">
                            <label for="login-password" class="form-label">密码</label>
                            <input type="password" class="form-control" id="login-password" required>
                        </div>
                        <div class="text-danger mb-3" id="login-error"></div>
                        <button type="submit" class="btn btn-primary w-100">登录</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 注册模态框 -->
    <div class="modal fade" id="register-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">用户注册</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="register-form">
                        <div class="mb-3">
                            <label for="register-username" class="form-label">用户名</label>
                            <input type="text" class="form-control" id="register-username" required>
                        </div>
                        <div class="mb-3">
                            <label for="register-name" class="form-label">昵称</label>
                            <input type="text" class="form-control" id="register-name" required>
                        </div>
                        <div class="mb-3">
                            <label for="register-password" class="form-label">密码</label>
                            <input type="password" class="form-control" id="register-password" required>
                        </div>
                        <div class="mb-3">
                            <label for="register-password-confirm" class="form-label">确认密码</label>
                            <input type="password" class="form-control" id="register-password-confirm" required>
                        </div>
                        <div class="text-danger mb-3" id="register-error"></div>
                        <button type="submit" class="btn btn-primary w-100">注册</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <footer class="wz-footer mt-5 py-4">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h5>万知相同社区平台</h5>
                    <p>欢迎加入我们的社区，与志同道合的伙伴一起交流分享！</p>
                </div>
                <div class="col-md-3">
                    <h5>关于我们</h5>
                    <ul class="list-unstyled">
                        <li><a href="/about">平台介绍</a></li>
                        <li><a href="/contact">联系我们</a></li>
                        <li><a href="/terms">服务条款</a></li>
                    </ul>
                </div>
                <div class="col-md-3">
                    <h5>快速链接</h5>
                    <ul class="list-unstyled">
                        <li><a href="/faq">常见问题</a></li>
                        <li><a href="/help">帮助中心</a></li>
                        <li><a href="/feedback">意见反馈</a></li>
                    </ul>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col text-center">
                    <p class="mb-0">© 2025 万知相同社区平台 版权所有</p>
                </div>
            </div>
        </div>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
